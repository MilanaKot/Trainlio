<style>
body{margin:0;background:#F3F5F9;font-family:Manrope,"Segoe UI",system-ui,sans-serif;color:#0E1726}
.s{--bg:#F3F5F9;--surface:#FFFFFF;--ink:#0E1726;--muted:#55607A;--line:#DFE4EE;--n50:#ECEFF5;--accent:#2B55E0;--accentsoft:#E5EBFD;--disp:"Barlow Semi Condensed","Arial Narrow",sans-serif}
.disp{font-family:var(--disp)}
.meta{font-size:14px;line-height:20px;color:var(--muted)}
.pick{position:relative;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);box-sizing:border-box;cursor:pointer}
.pick.on{box-shadow:inset 0 0 0 2px var(--accent);background:#F7F9FF}
.pick input{position:absolute;width:1px;height:1px;opacity:0;margin:0}
.rad{width:24px;height:24px;border-radius:50%;box-sizing:border-box;box-shadow:inset 0 0 0 2px #B4BCCC;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.pick.on .rad{box-shadow:inset 0 0 0 2px var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.av{width:36px;height:36px;border-radius:50%;background:var(--accentsoft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.who{display:flex;flex-direction:column}
.who b{font-size:16px;line-height:22px;font-weight:600}
.btn{height:52px;width:100%;border-radius:12px;border:0;font:700 16px/1 Manrope,system-ui,sans-serif;background:var(--accent);color:#fff}
</style>

</div>

</div>

<label class="pick"><input type="radio" name="hl"><span class="rad" aria-hidden="true"></span><span class="av">LM</span><span class="who"><b>Lucie Marková</b></span></label>
