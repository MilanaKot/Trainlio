<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Upravit trenéra — bez e-mailu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F5F9;font-family:Manrope,"Segoe UI",system-ui,sans-serif;color:#0E1726}
.s{--bg:#F3F5F9;--surface:#FFFFFF;--ink:#0E1726;--muted:#55607A;--line:#DFE4EE;--n50:#ECEFF5;--accent:#2B55E0;--accentsoft:#E5EBFD;--danger:#B42318;--disp:"Barlow Semi Condensed","Arial Narrow",sans-serif}
.disp{font-family:var(--disp)}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:14px;line-height:20px;font-weight:600}
.lbl i{font-style:normal;color:var(--danger)}
.inp{height:52px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:#fff;padding:0 14px;font:500 16px Manrope,sans-serif;color:var(--ink);box-sizing:border-box;width:100%}
.cap{margin:0;padding:0 4px;font-size:12px;line-height:16px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:#13795B;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:23px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.help{font-size:13px;line-height:18px;color:var(--muted)}
.lbl span{font-weight:400;font-size:13px;color:var(--muted);float:right}
.bo{height:44px;padding:0 16px;border-radius:10px;border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font:600 15px/1 Manrope,sans-serif;color:var(--ink);display:inline-flex;align-items:center;gap:8px;align-self:flex-start}
.btn{height:52px;width:100%;border-radius:12px;border:0;font:700 16px/1 Manrope,system-ui,sans-serif;background:var(--accent);color:#fff}
</style>
</helmet>
<div class="s" style="width: 390px; height: 1000px; background: var(--bg); display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 52px 16px 0">
<a href="A01-Treneri.dc.html" style="height: 44px; display: inline-flex; align-items: center; color: var(--accent); text-decoration: none; font-size: 15px; font-weight: 700">Zrušit</a>
</div>

<main style="flex-grow: 1; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 16px">
<h1 class="disp" style="margin: 0; padding: 0 4px; font-size: 36px; line-height: 40px; font-weight: 700">Upravit trenéra</h1>

<div style="background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 18px">
<div class="field"><label class="lbl" for="j">Jméno <i aria-hidden="true">*</i></label><input id="j" class="inp" value="Petr" required></div>
<div class="field"><label class="lbl" for="p">Příjmení <i aria-hidden="true">*</i></label><input id="p" class="inp" value="Svoboda" required></div>
</div>

<h2 class="cap" style="margin-top: 4px">Přístup do aplikace</h2>
<div style="background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--bg)"><span style="color: var(--muted); flex-shrink: 0; margin-top: 1px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg></span><span style="display: flex; flex-direction: column"><b style="font-size: 15px; line-height: 22px; color: var(--muted)">Bez přístupu</b><span class="help" style="color: var(--ink)">Bez e-mailu se trenér nemůže přihlásit. U tréninků ho přesto můžete uvádět.</span></span></div>
<div class="field"><label class="lbl" for="e">E-mail <span>Pro přihlášení</span></label><input id="e" class="inp" type="email" value="" placeholder="jmeno@email.cz" style="box-shadow: inset 0 0 0 2px var(--accent),0 0 0 4px var(--accentsoft)"></div>
<button class="bo" disabled style="background: #ECEFF5; color: #8791A6; box-shadow: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>Poslat pozvánku</button>
</div>

<h2 class="cap" style="margin-top: 4px">Stav</h2>
<div style="background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px">
<span style="display: flex; flex-direction: column"><b style="font-size: 16px; font-weight: 600">Aktivní trenér</b><span style="font-size: 13px; line-height: 18px; color: var(--muted)">Lze ho vybrat pro nové tréninky</span></span>
<input type="checkbox" role="switch" checked style="position: absolute; opacity: 0; width: 1px; height: 1px"><span class="sw" aria-hidden="true"></span>
</label>
<div style="padding: 12px 14px; border-radius: 12px; background: var(--bg); font-size: 14px; line-height: 20px; color: var(--muted)">Po deaktivaci zůstane Petr Svoboda u všech minulých i naplánovaných tréninků (nyní 12). Trenéra nelze smazat, jen deaktivovat.</div>
</div>
</main>

<footer style="padding: 12px 16px 28px; background: var(--surface); box-shadow: 0 -1px 0 var(--line)">
<button class="btn">Uložit</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
