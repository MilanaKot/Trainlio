<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Organizace — bez loga</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F5F9;font-family:Manrope,"Segoe UI",system-ui,sans-serif;color:#0E1726}
.s{--bg:#F3F5F9;--surface:#FFFFFF;--ink:#0E1726;--muted:#55607A;--line:#DFE4EE;--n50:#ECEFF5;--accent:#2B55E0;--accentsoft:#E5EBFD;--danger:#B42318;--disp:"Barlow Semi Condensed","Arial Narrow",sans-serif}
.disp{font-family:var(--disp)}
.cap{margin:0;padding:0 4px;font-size:12px;line-height:16px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px}
.lbl{display:flex;justify-content:space-between;font-size:14px;line-height:20px;font-weight:600}
.lbl span{font-weight:400;font-size:13px;color:var(--muted)}
.inp{height:52px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:#fff;padding:0 14px;font:500 16px Manrope,sans-serif;color:var(--ink);box-sizing:border-box;width:100%}
.mono{background:var(--accentsoft);color:var(--accent);font-family:var(--disp);font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.help{font-size:13px;line-height:18px;color:var(--muted)}
.btn{height:52px;width:100%;border-radius:12px;border:0;font:700 16px/1 Manrope,system-ui,sans-serif;background:var(--accent);color:#fff}
</style>
</helmet>
<div class="s" style="width: 390px; height: 900px; background: var(--bg); display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 52px 8px 0">
<a href="A00-Vice.dc.html" style="height: 44px; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 15px; font-weight: 600"><span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"></path></svg></span>Více</a>
</div>

<main style="flex-grow: 1; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 16px">
<h1 class="disp" style="margin: 0; padding: 0 4px; font-size: 36px; line-height: 40px; font-weight: 700">Organizace</h1>

<h2 class="cap">Logo</h2>
<div class="panel">
<label style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 168px; border-radius: 16px; background: #F7F9FF; box-shadow: inset 0 0 0 2px #C7D4FA; border: 0; cursor: pointer; text-align: center; padding: 16px">
<input type="file" accept="image/png,image/svg+xml,image/jpeg" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<span style="width: 52px; height: 52px; border-radius: 16px; background: var(--accentsoft); color: var(--accent); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="m20.5 16-5-5-8 8"></path></svg></span>
<b style="font-size: 16px; color: var(--accent)">Nahrát logo</b>
<span class="help">PNG, SVG nebo JPG · čtvercové, min. 256 × 256 px · max. 2 MB</span>
</label>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--bg)">
<div class="mono" style="width: 44px; height: 44px; border-radius: 12px; font-size: 20px">HŠ</div>
<span style="font-size: 14px; line-height: 20px">Dokud logo nenahrajete, zobrazí se v aplikaci <b>iniciály názvu</b>.</span>
</div>
</div>

<h2 class="cap">Název</h2>
<div class="panel">
<div style="display: flex; flex-direction: column; gap: 6px"><label class="lbl" for="n">Název organizace <span style="color: var(--danger); font-weight: 700">*</span></label><input id="n" class="inp" value="Hokejová škola Příbram"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label class="lbl" for="k">Krátký název <span>Nepovinné</span></label><input id="k" class="inp" value="HŠ Příbram"><span class="help">Použije se tam, kde se celý název nevejde.</span></div>
</div>

</main>

<footer style="padding: 12px 16px 28px; background: var(--surface); box-shadow: 0 -1px 0 var(--line)">
<button class="btn">Uložit</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>

</body>
</html>
