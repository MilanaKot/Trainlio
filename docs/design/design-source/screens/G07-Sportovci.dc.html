<style>
body{margin:0;background:#F3F5F9;font-family:Manrope,"Segoe UI",system-ui,sans-serif;color:#0E1726}
.s{--bg:#F3F5F9;--surface:#FFFFFF;--ink:#0E1726;--muted:#55607A;--line:#DFE4EE;--n50:#ECEFF5;--accent:#2B55E0;--accentsoft:#E5EBFD;--disp:"Barlow Semi Condensed","Arial Narrow",sans-serif}
.disp{font-family:var(--disp)}
.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:flex-start;box-shadow:0 1px 2px rgba(14,23,38,.06);text-decoration:none;color:inherit}
.av{width:56px;height:56px;border-radius:50%;background:var(--accentsoft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.body{display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0}
.name{font-size:17px;line-height:24px;font-weight:700}
.meta{font-size:14px;line-height:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.sports{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sport{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--n50);font-size:13px;font-weight:600}
.sport span{color:var(--muted);font-weight:500}
.chev{color:#8791A6;flex-shrink:0;align-self:center}
.add{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;border:0;background:var(--accentsoft);color:var(--accent);font:700 16px/1 Manrope,system-ui,sans-serif}
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:76px;padding-bottom:8px;box-sizing:border-box;background:var(--surface);box-shadow:0 -1px 0 var(--line)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}
.nav a.act{color:var(--accent)}
</style>
