<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Přidat trenéra — admin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F5F9;font-family:Manrope,"Segoe UI",system-ui,sans-serif;color:#0E1726}
.s{--bg:#F3F5F9;--surface:#FFFFFF;--ink:#0E1726;--muted:#55607A;--line:#DFE4EE;--accent:#2B55E0;--accentsoft:#E5EBFD;--danger:#B42318;--disp:"Barlow Semi Condensed","Arial Narrow",sans-serif}
.disp{font-family:var(--disp)}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:14px;line-height:20px;font-weight:600}
.lbl i{font-style:normal;color:var(--danger)}
.inp{height:52px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:#fff;padding:0 14px;font:500 16px Manrope,sans-serif;color:var(--ink);box-sizing:border-box;width:100%}
.inp.f{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 4px var(--accentsoft)}
.inp.err{box-shadow:inset 0 0 0 2px var(--danger)}
.help{font-size:13px;line-height:18px;color:var(--muted)}
.lbl span{font-weight:400;font-size:13px;color:var(--muted);float:right}
.btn{height:52px;width:100%;border-radius:12px;border:0;font:700 16px/1 Manrope,system-ui,sans-serif;background:var(--accent);color:#fff}
</style>
</helmet>
<div class="s" style="width: 390px; height: 960px; background: var(--bg); display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 52px 16px 0">
<a href="A01-Treneri.dc.html" style="height: 44px; display: inline-flex; align-items: center; color: var(--accent); text-decoration: none; font-size: 15px; font-weight: 700">Zrušit</a>
</div>

<main style="flex-grow: 1; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 16px">
<h1 class="disp" style="margin: 0; padding: 0 4px; font-size: 36px; line-height: 40px; font-weight: 700">Nový trenér</h1>

<div style="background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 18px">
<div class="field"><label class="lbl" for="j">Jméno <i aria-hidden="true">*</i></label><input id="j" class="inp" value="Tomáš" required></div>
<div class="field"><label class="lbl" for="p">Příjmení <i aria-hidden="true">*</i></label><input id="p" class="inp" value="Říha" required></div>
</div>

<h2 style="margin: 4px 0 0; padding: 0 4px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted)">Kontakt</h2>
<div style="background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 18px">
<div class="field"><label class="lbl" for="e">E-mail <span>Pro přihlášení</span></label><input id="e" class="inp f" type="email" value="tomas.riha@email.cz" autocomplete="off"><span class="help">Pošleme sem pozvánku. Bez e-mailu se trenér do aplikace nepřihlásí.</span></div>
<div class="field"><label class="lbl" for="t">Telefon <span>Nepovinné</span></label><input id="t" class="inp" type="tel" placeholder="+420 123 456 789"><span class="help">Rodiče ho uvidí, když trenér jejich dítě odhlásí z tréninku.</span></div>
</div>

<p style="margin: 0; padding: 0 4px; font-size: 14px; line-height: 20px; color: var(--muted)">Trenér bude hned k dispozici při výběru hlavního trenéra a asistentů, i když se ještě nepřihlásil.</p>
</main>

<footer style="padding: 12px 16px 28px; background: var(--surface); box-shadow: 0 -1px 0 var(--line)">
<button class="btn">Přidat a poslat pozvánku</button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
