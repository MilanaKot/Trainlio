.tools{display:flex;align-items:center;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
main{display:flex;flex-direction:column;align-items:center;padding:28px 16px 48px;gap:14px}
.cap{font-size:13px;color:var(--muted)}
.cap b{color:var(--ink)}

.phone::-webkit-scrollbar{display:none}
.nav-row{display:flex;gap:8px}
.nav-row button{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font:600 14px Manrope,sans-serif;cursor:pointer}
@media (max-width:760px){body{grid-template-columns:1fr}aside{position:static;height:auto}}
</style>

<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  document.getElementById('ptitle').textContent = D.title;
  var order = [];
  var list = document.getElementById('list');
  D.groups.forEach(function (g) {
    var h = document.createElement('h2'); h.textContent = g.name; list.appendChild(h);
    g.items.forEach(function (it) {
      order.push(it);
      var b = document.createElement('button'); b.className = 's'; b.textContent = it.label; b.dataset.id = it.id;
      b.addEventListener('click', function () { go(it.id); });
      list.appendChild(b);
    });
  });
  var hostEl = document.getElementById('host');
  var root = hostEl.attachShadow({ mode: 'open' });
  var highlight = false;
  document.getElementById('hs').addEventListener('change', function (e) { highlight = e.target.checked; render(current); });
  var current = null;

  function labelOf(id) { for (var i = 0; i < order.length; i++) if (order[i].id === id) return order[i].label; return id; }
  function go(id) { if (!D.screens[id]) return; location.hash = id; }
  function textOf(el) { return (el.textContent || '').replace(/\s+/g, ' ').trim(); }

  function bind(el, target) {
    el.style.cursor = 'pointer';
    if (highlight) { el.style.outline = '2px dashed #E3A034'; el.style.outlineOffset = '2px'; }
    el.addEventListener('click', function (ev) { ev.preventDefault(); ev.stopPropagation(); go(target); });
  }

  function render(id) {
    var s = D.screens[id]; if (!s) return;
    current = id;
    root.innerHTML = '<style>' + s.css + '</style>' + s.html;
    root.querySelectorAll('[data-go]').forEach(function (a) { if (D.screens[a.dataset.go]) bind(a, a.dataset.go); });
    var rules = (D.hotspots[id] || []);
    var candidates = root.querySelectorAll('button, a, label, span, article, div[role="tab"], span[role="tab"]');
    rules.forEach(function (r) {
      var key = r[0], target = r[1];
      if (!D.screens[target]) return;
      if (/^(a\.|article|div\.|span\.|label)/.test(key) || key === 'article') {
        root.querySelectorAll(key).forEach(function (el) { bind(el, target); });
        return;
      }
      var hit = null;
      candidates.forEach(function (el) { if (!hit && /^(BUTTON|A)$/.test(el.tagName) && (textOf(el) === key || el.getAttribute('aria-label') === key)) hit = el; });
      if (!hit) candidates.forEach(function (el) { if (!hit && textOf(el) === key) hit = el; });
      if (!hit) candidates.forEach(function (el) { if (!hit && /^(BUTTON|A)$/.test(el.tagName) && textOf(el).indexOf(key) === 0) hit = el; });
      if (hit) bind(hit.closest('button, a, label') || hit, target);
    });
    root.querySelectorAll('nav a').forEach(function (a) {
      var t = D.nav[textOf(a)];
      if (t && D.screens[t]) bind(a, t);
    });
    document.getElementById('phone').scrollTop = 0;
    document.getElementById('cap').innerHTML = '<b>' + labelOf(id) + '</b> · ' + s.title;
    list.querySelectorAll('button.s').forEach(function (b) { b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'); });
  }

  function step(d) {
    var i = order.findIndex(function (o) { return o.id === current; });
    var n = order[(i + d + order.length) % order.length];
    go(n.id);
  }
  document.getElementById('prev').addEventListener('click', function () { step(-1); });
  document.getElementById('next').addEventListener('click', function () { step(1); });
  window.addEventListener('hashchange', function () { render(location.hash.slice(1)); });
  render(D.screens[location.hash.slice(1)] ? location.hash.slice(1) : order[0].id);
})();
</script>
</body>
